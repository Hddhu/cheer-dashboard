<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B4BC4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cheer">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3FB; --surface:#FFFFFF; --surface2:#ECEAF8; --ink:#231F3D; --muted:#6D6989;
  --line:#DEDBEF; --paars:#5B4BC4; --paars-soft:#E6E2FA; --blauw:#3D78D0; --blauw-soft:#E1ECFA;
  --done:#4E9C80; --done-soft:#DDF1E9; --warm:#C79436; --warm-soft:#F8EDD6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15132A; --surface:#211E3A; --surface2:#2A2648; --ink:#ECEAF8; --muted:#A6A2C4;
    --line:#35305A; --paars:#A194F2; --paars-soft:#332C63; --blauw:#82B0F2; --blauw-soft:#1F3252;
    --done:#7CC7A8; --done-soft:#1D3A31; --warm:#E3B863; --warm-soft:#3C3120;
  }
}
:root[data-theme="dark"]{
  --bg:#15132A; --surface:#211E3A; --surface2:#2A2648; --ink:#ECEAF8; --muted:#A6A2C4;
  --line:#35305A; --paars:#A194F2; --paars-soft:#332C63; --blauw:#82B0F2; --blauw-soft:#1F3252;
  --done:#7CC7A8; --done-soft:#1D3A31; --warm:#E3B863; --warm-soft:#3C3120;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.top .who{font-weight:600;color:var(--muted);font-size:14px}
.top .wk{font-size:14px;color:var(--paars);font-weight:600}

/* Hero: dag */
.day-hero{padding:6px 2px 14px}
.day-hero .date{color:var(--muted);font-size:15px}
.day-hero h1{font-size:clamp(30px,8vw,40px);line-height:1.05;margin:6px 0 8px}
.day-hero .sub{color:var(--muted);font-size:15px}
.daynav{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.pill:focus-visible,.item:focus-visible,.tab:focus-visible,.food:focus-visible,.sum:focus-visible{outline:2px solid var(--paars);outline-offset:2px}
.pill.on{background:var(--paars);border-color:var(--paars);color:#fff}

/* weekstrip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 18px}
.sd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 0 8px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted)}
.sd b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.sd i{display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:var(--line)}
.sd.gym i{background:var(--paars)} .sd.cheer i{background:var(--blauw)} .sd.cond i{background:var(--warm)} .sd.rest i{background:var(--line)}
.sd.cur{border-color:var(--paars);box-shadow:inset 0 0 0 1px var(--paars)}
.sd.full i{background:var(--done)}

.progress{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:4px 0 18px}
.progress span{display:block;height:100%;background:var(--done);transition:width .3s}

.note{background:var(--warm-soft);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:0 0 14px}
.note b{font-weight:600}

/* blokken */
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
.block>h3{font-size:17px;padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block>h3 small{font-family:"Figtree",sans-serif;font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0}
.item{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.block>h3+.item{border-top:0}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);margin-top:1px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.item.ok .box{background:var(--done);border-color:var(--done)}
.item.ok .box::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.item .nm{font-weight:600;font-size:15.5px}
.item.ok .nm{color:var(--muted)}
.item .ds{font-size:14.5px;color:var(--paars);font-weight:600}
.item .nt{font-size:13.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.test{background:var(--warm-soft);color:var(--warm)}
.tag.opt{background:var(--blauw-soft);color:var(--blauw)}

/* training tab */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:0 0 10px;overflow:hidden}
.phase>.sum{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left}
.phase .pn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px}
.phase .pw{color:var(--muted);font-size:13.5px}
.phase .st{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.st.klaar{background:var(--done-soft);color:var(--done)} .st.nu{background:var(--paars-soft);color:var(--paars)} .st.straks{background:var(--surface2);color:var(--muted)}
.phase .body{padding:0 16px 14px;display:none}
.phase.open .body{display:block}
.phase .focus{font-size:14.5px;color:var(--muted);margin:0 0 10px}
.wkrow{border-top:1px solid var(--line);padding:10px 0}
.wkrow h4{margin:0 0 6px;font-size:14.5px}
.wkrow h4 span{color:var(--muted);font-weight:500}
.dayl{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;font-size:14px}
.dayl button{grid-column:1/-1;display:grid;grid-template-columns:34px 1fr;gap:8px;background:none;border:0;padding:3px 0;text-align:left;cursor:pointer}
.dayl .dn{color:var(--muted)}
.kr{margin-top:8px}
.krh{font-weight:600;font-size:14px;margin-bottom:2px}
.krr{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;color:var(--muted)}
.krr b{color:var(--paars);font-weight:600;text-align:right}
.lifts{font-size:13.5px;color:var(--muted);margin-top:6px}

table.goals{width:100%;border-collapse:collapse;font-size:14px}
.goals th,.goals td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.goals th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
.goals td:last-child{color:var(--paars);font-weight:600}
.scroll{overflow-x:auto}

/* eiwit */
.pro-hero{display:flex;align-items:flex-end;gap:14px;margin:6px 0 4px}
.pro-hero .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:56px;line-height:.9}
.pro-hero .of{color:var(--muted);font-size:16px;padding-bottom:6px}
.meta{color:var(--muted);font-size:14px;margin:6px 0 16px}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 12px 14px}
.food{position:relative;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:10px 11px;text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.food .fn{font-weight:600;font-size:14.5px;line-height:1.2}
.food .fp{font-size:12.5px;color:var(--muted);margin-top:3px}
.food .cnt{position:absolute;top:8px;right:9px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--paars);color:#fff;font-size:12.5px;font-weight:700;display:none;align-items:center;justify-content:center}
.food.has{border-color:var(--paars);background:var(--paars-soft)}
.food.has .cnt{display:flex}
.grp{font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 16px 2px}
.hint{font-size:13px;color:var(--muted);padding:0 16px 12px}
.water{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 14px}
.glass{width:30px;height:38px;border-radius:5px 5px 9px 9px;border:1.5px solid var(--blauw);background:none;cursor:pointer;position:relative;overflow:hidden;padding:0}
.glass.on{background:var(--blauw)}
.supp{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;max-width:560px;width:100%}
.tab{flex:1;background:none;border:0;padding:12px 0 13px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-top:2px solid transparent}
.tab.on{color:var(--paars);border-top-color:var(--paars)}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ PROGRAMMA ============ */
const START = new Date(2026, 9, 5); // ma 5 okt 2026
const DAGEN = ["ma","di","wo","do","vr","za","zo"];
const DAGEN_LANG = ["maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag","zondag"];
const MAANDEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

const FASES = [
  {n:"Nulmeting & instap", w:[1], focus:"Tests doen, techniek leren, rustig instappen. Eiwit stap 1."},
  {n:"Basis", w:[2,3], focus:"Volume opbouwen, eiwit naar doel, slaap een kwartier eerder."},
  {n:"Vakantie & herstart", w:[4], focus:"Vakantie van 22 t/m 29 oktober. Vrijdag 30 oktober weer instappen met de gewichten van week 2."},
  {n:"Opbouw", w:[5,6,7], focus:"Kracht omhoog, mild calorietekort start, handstand los van de muur oefenen."},
  {n:"Lichte week", w:[8], focus:"Minder sets, zelfde techniek. Herstellen voor de laatste push."},
  {n:"Intensivering", w:[9,10], focus:"Zwaarder en explosiever. Skills met spot van je coach."},
  {n:"Testweek", w:[11], focus:"Alle doelen meten. Laat je coaches zien wat je kunt."},
  {n:"Kerst & afbouw", w:[12], focus:"Onderhoud, terug naar onderhoudscalorieën, genieten."}
];
const faseVan = w => FASES.find(f => f.w.includes(w));

// index = week (1..12); 4 = vakantie
const L = {
  squat:  [null,"3×6 · 70 kg","3×6 · 72,5 kg","3×6 · 75 kg",null,"4×5 · 77,5 kg","4×5 · 80 kg","4×5 · 82,5 kg","2×5 · 70 kg","4×4 · 85 kg","3×4 · 87,5 kg","Test: 87,5 kg × 5","2×5 · 70 kg"],
  rdl:    [null,"3×8 · 60 kg","3×8 · 62,5 kg","3×8 · 65 kg",null,"3×8 · 67,5 kg","3×8 · 70 kg","3×8 · 72,5 kg","2×8 · 60 kg","3×6 · 75 kg","3×6 · 77,5 kg","3×6 · 75 kg","2×8 · 60 kg"],
  lunge:  [null,"3×8/been · 20 kg","3×8/been · 20 kg","3×8/been · 25 kg",null,"3×8/been · 25 kg","3×8/been · 27,5 kg","3×8/been · 30 kg","2×8/been · 20 kg","3×8/been · 30 kg","3×8/been · 32,5 kg","3×8/been · 30 kg","2×8/been · 20 kg"],
  hip:    [null,"3×8 · 85 kg","3×8 · 90 kg","3×8 · 90 kg",null,"3×8 · 95 kg","3×8 · 100 kg","3×8 · 100 kg","2×8 · 80 kg","3×6 · 105 kg","3×6 · 110 kg","3×6 · 105 kg","2×8 · 80 kg"],
  press:  [null,"3×6 · 22,5 kg","3×7 · 22,5 kg","3×8 · 22,5 kg",null,"3×6 · 25 kg","3×7 · 25 kg","3×8 · 25 kg","2×6 · 20 kg","4×5 · 27,5 kg","4×4 · 30 kg","Test: 30 kg × 5","2×6 · 20 kg"],
  pull:   [null,"3×8 · 40 kg","3×9 · 40 kg","3×10 · 40 kg",null,"3×8 · 45 kg","3×9 · 45 kg","3×10 · 45 kg","2×8 · 37,5 kg","3×8 · 50 kg","3×8 · 52,5 kg","Test: 52,5 kg × 8","2×8 · 40 kg"],
  push:   [null,"Test: max reps","3×7","3×8",null,"4×8","4×9","4×10","2×8","3×11","3×12","Test: max (doel 15)","2×8"],
  ohold:  [null,"3×20 s · 30 kg","3×20 s · 30 kg","3×25 s · 30 kg",null,"3×20 s · 35 kg","3×25 s · 35 kg","3×25 s · 35 kg","2×20 s · 30 kg","3×20 s · 40 kg","3×25 s · 40 kg","3×25 s · 40 kg","2×20 s · 30 kg"],
  row:    [null,"3×10 · 40 kg","3×10 · 40 kg","3×12 · 40 kg",null,"3×10 · 45 kg","3×10 · 45 kg","3×12 · 45 kg","2×10 · 40 kg","3×8 · 50 kg","3×8 · 50 kg","3×8 · 50 kg","2×10 · 40 kg"],
  bss:    [null,"3×8/been · 15 kg","3×8/been · 15 kg","3×8/been · 17,5 kg",null,"3×8/been · 17,5 kg","3×8/been · 20 kg","3×8/been · 20 kg","2×8/been · 15 kg","3×8/been · 22,5 kg","3×8/been · 25 kg","3×8/been · 22,5 kg","2×8/been · 15 kg"],
  ham:    [null,"3×8 · 45 kg","3×8 · 45 kg","3×8 · 47 kg",null,"3×8 · 50 kg","3×8 · 50 kg","3×8 · 52 kg","2×8 · 45 kg","3×6 · 55 kg","3×6 · 57 kg","3×6 · 55 kg","2×8 · 45 kg"],
  abd:    [null,"3×15 · 60 kg","3×15 · 60 kg","3×15 · 65 kg",null,"3×15 · 65 kg","3×15 · 70 kg","3×15 · 70 kg","2×15 · 60 kg","3×12 · 75 kg","3×12 · 80 kg","3×12 · 75 kg","2×15 · 60 kg"],
  calf:   [null,"3×12 per been + 3×12","3×12 per been + 3×12","3×15 per been + 3×15",null,"3×15 per been + 3×15","3×15 per been + 3×15","3×15 per been + 3×15","2×12 per been + 2×12","3×12 per been, langzaam + 3×15","3×12 per been, langzaam + 3×15","3×12 per been + 3×15","2×12 per been + 2×12"],
  cop:    [null,"3×15 s per kant","3×15 s per kant","3×20 s per kant",null,"3×20 s per kant","3×25 s per kant","3×25 s per kant","2×15 s per kant","3×30 s per kant","3×30 s per kant","3×30 s per kant","2×15 s per kant"],
  curl:   [null,"3×8 · 15 kg","3×9 · 15 kg","3×10 · 15 kg",null,"3×8 · 17,5 kg","3×9 · 17,5 kg","3×10 · 17,5 kg","2×8 · 15 kg","3×8 · 20 kg","3×9 · 20 kg","3×8 · 20 kg","2×8 · 15 kg"],
  situp:  [null,"3×12","3×12","3×15",null,"3×15","3×15","3×18","2×12","3×20","3×20","3×20","2×12"],
  kneel:  [null,"3×3","3×3","3×4",null,"4×3","4×3","4×4","2×3","4×3","4×3","3×3","2×3"],
  box:    [null,"3×4 · lage box","3×4 · lage box","3×5 · lage box",null,"4×4 · middelhoge box","4×4 · middelhoge box","4×5 · middelhoge box","2×4 · lage box","4×3 · hoge box","4×3 · hoge box","3×3 · hoge box","2×4 · lage box"],
  plank:  [null,"Test: max tijd","3×35 s","3×40 s",null,"3×45 s","3×50 s","3×50 s","2×30 s","3×55 s","3×60 s","Test: max tijd","2×30 s"],
  hollow: [null,"3×15 s","3×20 s","3×20 s",null,"3×25 s","3×25 s","3×30 s","2×15 s","3×30 s","3×35 s","Test: max tijd","2×15 s"],
  side:   [null,"3×20 s/zijde","3×20 s/zijde","3×25 s/zijde",null,"3×30 s/zijde","3×30 s/zijde","3×35 s/zijde","2×20 s/zijde","3×40 s/zijde","3×40 s/zijde","3×40 s/zijde","2×20 s/zijde"],
  run:    [null,"6× (1 min lopen / 2 min wandelen)","6× (1,5 min / 1,5 min)","5× (2 min / 1,5 min)",null,"4× (3 min / 1,5 min)","4× (4 min / 1 min)","3× (6 min / 1,5 min)","3× (4 min / 1 min)","2× (9 min / 1,5 min)","2× (12 min / 1 min)","Test: 20 min aaneengesloten","15 min rustig, als je zin hebt"],
  crawl:  [null,"4×25 m crawl","4×25 m crawl","5×25 m crawl",null,"6×25 m crawl","6×25 m crawl","4×25 m + 2×50 m crawl","4×25 m crawl","4×50 m crawl","4×50 m crawl","Test: 50 m aaneengesloten","Rustig zwemmen, vrije slag"]
};
// week 4: na terugkomst instappen met week-2-gewichten
Object.keys(L).forEach(k=>{ L[k][4] = L[k][2]; });
const VAK_VAN = new Date(2026,9,22), VAK_TOT = new Date(2026,9,29);
const isVak = d => d>=VAK_VAN && d<=VAK_TOT;
const lichtWeek = w => w===8 || w===12;

function I(id,nm,ds,nt,tag){return {id,nm,ds:ds||"",nt:nt||"",tag:tag||""}}
const isTest = s => typeof s==="string" && s.startsWith("Test");

const lang = w => w>=5 ? 60 : 45;
function stretch(w){ const t=lang(w)+" s"; return {h:"Stretch", s:"± 12 min", items:[
  I("st1","Pancake met yogablok + cat & cow", t+" + 8×",""),
  I("st2","Couch stretch met muur", `2×${t} links, 1×${t} rechts`,"Heup naar voren, bil aanspannen."),
  I("st3","Hamstring stretch, enkel vasthouden", t+" per been",""),
  I("st4","Pigeon + mermaid", t+" per kant",""),
  I("st5","Pancake naar de zijkant", t+" per kant",""),
  I("st6","Spagaat links, rechts, midden", `links 2×${t}, rechts en midden 1×${t}`,"Blokken onder je handen, heup recht."),
  I("st7","Straddle leg lifts", w>=5?"12×":"10×","Actieve flexibiliteit: benen optillen zonder te zwaaien."),
  I("st8","Forward leg lifts", (w>=5?"12×":"10×")+" per been","")
]};}
function upperStretch(){ return {h:"Upper stretches", s:"± 5 min", items:[
  I("us1","Shoulder stretch","45 s per kant",""),
  I("us2","Doorway stretch","45 s",""),
  I("us3","Camel stretch","3×20 s","Heupen naar voren, borst omhoog.")
]};}
function handstand(w){
  const items=[
    I("hs1","Plank to pike","8×",""),
    I("hs2","Pike shoulder taps","8× per kant",""),
    I("hs3","Pike weight shift","8×","Gewicht naar je handen verplaatsen."),
    I("hs4","Pike leg lifts","5× per been",""),
    I("hs5","Pike fall out","3× per kant","Veilig uitvallen: dit geeft durf.")];
  if (w>=5 && w<=8) items.push(I("hs6","Chest-to-wall hold", w===8?"2×20 s":"3×30 s","Opbouw naar vrij staan."));
  if (w>=9) items.push(I("hs6","Vrije handstand","8 pogingen","Tel je seconden en noteer je beste.", w===11?"test":""));
  return {h:"Handstand", s:"± 10 min", items};
}
function brug(w){
  const items=[
    I("br1","Brug stretch", w>=5?"3×30 s":"3×20 s","Schouders naar voren boven je handen."),
    I("br2","Bridge rocks","8×",""),
    I("br3","Wall walk down","3×",""),
    I("br4","Bridge leg lifts","5× per been",""),
    I("br5","Bridge kick from wall","5×","")];
  if (w>=9) items.push(I("br6","Uit brug opstaan / walkover met spot","3×","Vraag je coach om te spotten.", w===11?"test":""));
  return {h:"Brug drills", s:"± 10 min", items};
}
function coreCircuit(w){
  const r = (w===8||w===12) ? 1 : (w<=3 ? 2 : 3);
  return {h:"Core circuit", s:`${r} ${r===1?"ronde":"rondes"}`, items:[
    I("cc1","Knee raises","8×",""),
    I("cc2","Leg raises","8×",""),
    I("cc3","Side raises","2×4",""),
    I("cc4","Around the world","4×",""),
    I("cc5","Marches","8×",""),
    I("cc6","Hold","tot falen","")
  ]};

function sessie(date){
  const w = weekVan(date), d = dagIdx(date);
  if (w<1) return {titel:"Nog even rust", sub:"Het programma start maandag 5 oktober.", type:"rest", blocks:[
    {h:"Klaarzetten", s:"", items:[I("pre1","Nieuwe eiwitdoelen bekijken","",""),I("pre2","Straps in je gymtas","",""),I("pre3","Hevy-routines klaarzetten","","")]}]};
  if (w>12) return {titel:"Blok afgerond", sub:"Tijd voor een terugblik en het volgende blok.", type:"rest", blocks:[]};
  if (isVak(date)) return {titel:"Vakantie", sub:"Rustweek: je lichaam bouwt nu op.", type:"rest", blocks:vakantie()};
  let t, sub, type, blocks=[];
  switch(d){
    case 0: t="Zwemmen"; sub="Borstcrawl, core en handstand"; type="cond"; blocks=[...zwemmen(w), handstand(w)];
      if (w%2===1) blocks.unshift(metingen(w)); break;
    case 1: t="Leg day"; sub="Plyo, kracht, core en stretch"; type="gym"; blocks=[...legs(w), stretch(w)]; break;
    case 2: t="Cheer"; sub="Teamtraining + core, brug en stretch"; type="cheer"; blocks=[...cheer(w), coreCircuit(w), brug(w), stretch(w)]; break;
    case 3: t="Pilates & hardlopen"; sub="Ochtend reformer en stretchen, avond intervallen"; type="cond"; blocks=reformer(w); break;
    case 4: t="Upper body"; sub="Kracht, core, handstand en brug"; type="gym"; blocks=[...upper(w), handstand(w), brug(w)]; break;
    case 5: t="Cheer"; sub="Teamtraining + handstand, brug en stretch"; type="cheer"; blocks=[...cheer(w), handstand(w), brug(w), stretch(w)]; break;
    case 6: t="Rustdag"; sub="Herstellen hoort bij het programma"; type="rest"; blocks=rust(); break;
  }
  blocks = [...blocks.filter(b=>b.h!=="Herstel"), ...blocks.filter(b=>b.h==="Herstel")];
  if (lichtWeek(w) && (d===1||d===4)) sub += " · lichte week";
  if (w===4 && d===4) sub += " · herstart na vakantie";
  if (w===11 && (d===1||d===4||d===0||d===3)) sub += " · testweek";
  return {titel:t, sub, type, blocks};
}

const dstr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = (d,n) => {const x=new Date(d); x.setDate(x.getDate()+n); return x};
const dagIdx = d => (d.getDay()+6)%7;
const diffDagen = (a,b) => Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate()) - new Date(b.getFullYear(),b.getMonth(),b.getDate()))/864e5);
const weekVan = d => { const n = diffDagen(d, START); return n<0 ? 0 : Math.floor(n/7)+1; };
const maandag = d => addDays(d, -dagIdx(d));
const today0 = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };

async function initDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use("db"); const user = await window.claude.use("user");
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    dbRef = db.doc("data/users/"+id+"/state/main");
    const snap = await dbRef.get();
    if(snap.exists){ const d = snap.data()||{}; S = Object.assign({checks:{},food:{},water:{},supps:{}}, d); lsSet(); }
    else { await dbRef.set(S); }
    syncTxt = "Opgeslagen in je account";
    render();

}

      const ma = addDays(START,(w-1)*7);
      const lst = (nm,rows) => `<div class="kr"><div class="krh">${nm}</div>${rows.map(([a,b])=>`<div class="krr"><span>${a}</span><b>${esc(b)}</b></div>`).join("")}</div>`;

      let inhoud;

      else inhoud = (w===3?`<div class="lifts">Vakantie vanaf do 22 okt: upper body vervalt deze week.</div>`:"") + lst("Leg day · di", legsR) + (w===3?"":lst("Upper body · vr", upR)) + (w===3?lst("Conditioning", [condR[0]]):lst("Conditioning", condR));

      <div class="water">${Array.from({length:10},(_,i)=>`<button class="glass ${i<water?"on":""}" data-water="${i+1}" aria-label="${i+1} glazen"></button>`).join("")}</div>
    </section>
    <section class="block"><h3>Supplementen</h3>
      <div class="supp">${SUPPS.map(s=>`<button class="pill ${sp[s.id]?"on":""}" data-supp="${s.id}">${esc(s.n)}</button>`).join("")}</div>
    </section>
    <div class="sync">${esc(syncTxt)}</div>`;
}

function render(){
  if(tab==="vandaag") renderVandaag(); else if(tab==="training") renderTraining(); else renderEiwit();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.t===tab));
}

/* events */
document.querySelector(".tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return; tab = b.dataset.t; if(tab==="training") openWeek=null; render(); window.scrollTo(0,0);
});
app.addEventListener("click", e=>{
  const t = e.target.closest("[data-k],[data-nav],[data-go],[data-ph],[data-water],[data-supp]"); if(!t) return;
  const key = dstr(view);
  if(t.dataset.k){ S.checks[key]=S.checks[key]||{}; S.checks[key][t.dataset.k]=!S.checks[key][t.dataset.k]; save(); render(); }
  else if(t.dataset.nav){ const n=+t.dataset.nav; view = n===0?today0():addDays(view,n); render(); }
  else if(t.dataset.go){ const [y,m,d]=t.dataset.go.split("-").map(Number); view=new Date(y,m-1,d); tab="vandaag"; render(); window.scrollTo(0,0); }
  else if(t.dataset.ph){ const fi=+t.dataset.ph; const wasOpen=t.parentElement.classList.contains("open"); openWeek = wasOpen?-1:fi; render(); }
  else if(t.dataset.water){ const n=+t.dataset.water; S.water[key] = (S.water[key]===n)?n-1:n; save(); render(); }
  else if(t.dataset.supp){ S.supps[key]=S.supps[key]||{}; S.supps[key][t.dataset.supp]=!S.supps[key][t.dataset.supp]; save(); render(); }
});
/* eiwit: tik +1, lang drukken −1 */
let pressT=null, longDone=false;
function foodChange(id,delta){
  const key=dstr(view); S.food[key]=S.food[key]||{};
  S.food[key][id]=Math.max(0,(S.food[key][id]||0)+delta); if(!S.food[key][id]) delete S.food[key][id];
  save(); render();
}
app.addEventListener("pointerdown", e=>{
  const b=e.target.closest("[data-food]"); if(!b) return; longDone=false;
  pressT=setTimeout(()=>{ longDone=true; foodChange(b.dataset.food,-1); if(navigator.vibrate) try{navigator.vibrate(20)}catch(_){} },500);
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>app.addEventListener(ev,()=>clearTimeout(pressT)));
app.addEventListener("click", e=>{
  const b=e.target.closest("[data-food]"); if(!b) return;
  if(longDone){ longDone=false; return; } foodChange(b.dataset.food,1);
});
app.addEventListener("contextmenu", e=>{ if(e.target.closest("[data-food]")) e.preventDefault(); });

lsGet(); render(); initDb();
if ("serviceWorker" in navigator) { window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
